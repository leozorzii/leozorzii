<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Leonardo Zorzi - AI and Full Stack Engineer">
  <defs>
    <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#0b0b0c"/>
      <rect width="40" height="40" fill="#161618"/>
      <rect x="40" y="40" width="40" height="40" fill="#161618"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <clipPath id="tagClip">
      <rect x="0" y="0" height="280" width="0">
        <animate attributeName="width" from="0" to="1200" dur="2.4s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
    <style>
      .name { font: 700 66px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; fill: url(#nameFill); }
      .tag  { font: 500 21px 'Consolas', 'SFMono-Regular', 'Courier New', monospace; fill: #d4d4d8; letter-spacing: 0.5px; }
      .acc  { fill: #60a5fa; }
      .rise { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .drift { animation: drift 14s linear infinite; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-80px); } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="#0b0b0c"/>
  <g class="drift"><rect x="0" y="0" width="1360" height="280" fill="url(#checker)"/></g>
  <rect width="1200" height="280" fill="url(#vignette)"/>
  <rect width="1200" height="280" fill="url(#fadeBottom)"/>

  <rect x="-400" y="0" width="400" height="280" fill="url(#sweep)">
    <animate attributeName="x" from="-400" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="0" y="0" width="1200" height="2" fill="#27272a"/>
  <rect x="0" y="278" width="1200" height="2" fill="#27272a"/>

  <text x="600" y="132" text-anchor="middle" class="name rise">Leonardo Zorzi</text>

  <g clip-path="url(#tagClip)">
    <text x="600" y="185" text-anchor="middle" class="tag">AI Engineer <tspan class="acc">/</tspan> Full Stack <tspan class="acc">/</tspan> Security-minded backend</text>
  </g>
  <text x="600" y="228" text-anchor="middle" class="tag" style="font-size:15px;fill:#71717a">auth &#183; RLS &#183; encryption &#183; LLM guardrails &#183; CI/CD</text>
  <rect x="598" y="244" width="4" height="18" fill="#60a5fa" class="blink"/>
</svg>
